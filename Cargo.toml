[package]
name = "rusty-lisp"
version = "0.75.0"
edition = "2021"
description = "A modern Lisp interpreter in Rust with TCO, macros, JIT, verification checkers, and AI agent capabilities"
license = "AGPL-3.0-or-later"   # commercial licensing available on inquiry
repository = "https://github.com/TheLakeMan/rusty"
readme = "README.md"
default-run = "rusty"   # `cargo run` starts the REPL (not rusty-lsp)
# Leading "/" anchors to the package root: an unanchored glob like "*.lisp" or
# "README.md" matches at ANY depth (gitignore semantics) and would slurp local-
# only files (.claude/**, my-project/README.md) into the published crate.
include = ["src/**", "/*.lisp", "/Cargo.toml", "/README.md", "/LICENSE*", "docs/SPEC.md", "docs/TUTORIAL.md"]

[[bin]]
name = "rusty"
path = "src/main.rs"

[[bin]]
name = "rusty-lsp"
path = "src/lsp_main.rs"

[lib]
name = "rusty"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
rustyline = "14.0"
# rustls (pure Rust) instead of native-tls: no system libssl at build OR run
# time — release binaries stay self-contained and aarch64 cross-compiles clean
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustc-hash = "2"   # FxHashMap for env frames - SipHash is the wrong default for short var names
sha2 = "0.10"      # file-hash: SHA-256. Rolling our own crypto primitive is the
                   # one place "self-built equivalent" is the wrong instinct.

# Python bindings (optional)
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"], optional = true }
libloading = "0.9.0"

[features]
default = ["python"]
python = ["dep:pyo3"]
