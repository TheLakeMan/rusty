[package]
name = "rusty"
version = "0.24.0"
edition = "2021"
description = "A modern Lisp interpreter in Rust with TCO, macros, and AI agent capabilities"

[[bin]]
name = "rusty"
path = "src/main.rs"

[lib]
name = "rusty"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
rustyline = "14.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustc-hash = "2"   # FxHashMap for env frames - SipHash is the wrong default for short var names

# Python bindings (optional)
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"], optional = true }
libloading = "0.9.0"

[features]
default = ["python"]
python = ["dep:pyo3"]
